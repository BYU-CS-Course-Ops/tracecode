[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecode"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tracecode = "tracecode.cli:main"

[tool.setuptools]
packages = ["tracecode"]

[tool.setuptools.package-data]
tracecode = ["trace_viewer.html"]

[dependency-groups]
dev = [
    "myteam>=0.3.21",
    "pytest>=9.2.0",
    "rosters",
]

[tool.uv.sources]
rosters = { path = "../rosters", editable = true }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trace recording</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; line-height: 1.4; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      color: #202124;
      background: #f7f8fa;
    }
    header { flex: none; padding: .65rem 1rem; background: #202a44; color: white; }
    h1 { margin: 0; font-size: 1.15rem; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: .75rem;
      flex: 1;
      min-height: 0;
      padding: .75rem;
    }
    section { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    h2 { flex: none; margin: 0 0 .4rem; font-size: 1rem; }
    #source, #frames {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border: 1px solid #c8ccd3;
      border-radius: .35rem;
      background: white;
    }
    #source { padding: .4rem 0; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .source-line { display: grid; grid-template-columns: 3.25rem 1fr; min-height: 1.45em; }
    .source-line.call-site { background: #eceff3; }
    .source-line.current { background: #fff0a6; }
    .line-number { color: #7a808a; text-align: right; padding-right: .65rem; user-select: none; }
    .source-text { white-space: pre; }
    #controls { display: flex; align-items: center; gap: .45rem; flex: none; padding-top: .55rem; }
    button { padding: .35rem .7rem; }
    button:disabled { opacity: .5; }
    #position { margin-left: auto; font-variant-numeric: tabular-nums; }
    #event-info { flex: none; margin: 0 0 .4rem; font-size: .9rem; font-weight: 600; }
    #frames { display: flex; flex-direction: column; gap: .45rem; padding: .4rem; box-sizing: border-box; }
    .frame-card { flex: none; overflow: hidden; border: 1px solid #cbd2dc; border-radius: .3rem; background: white; }
    .frame-heading { padding: .3rem .5rem; background: #e9edf3; font-size: .82rem; font-weight: 650; overflow-wrap: anywhere; }
    .return-notice { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem; border-top: 1px solid #edf0f4; padding: .3rem .5rem; background: #f5f7fa; font-size: .82rem; }
    .variable-card { display: flex; align-items: baseline; gap: .55rem; border-top: 1px solid #edf0f4; padding: .25rem .5rem; }
    .variable-name { flex: none; min-width: 0; font-size: .82rem; font-weight: 700; overflow-wrap: anywhere; }
    .variable-type { flex: none; color: #626a76; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .variable-value { flex: 1; min-width: 0; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .empty-state { padding: .5rem; color: #666; font-style: italic; }
    @media (max-width: 760px) {
      body { height: auto; min-height: 100%; overflow: auto; }
      main {
        flex: none;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(15rem, 45vh) minmax(15rem, 45vh);
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <header><h1 id="title">Trace recording</h1></header>
  <main>
    <section aria-label="Original source code">
      <h2>Source</h2>
      <div id="source" role="region" aria-label="Source code"></div>
      <div id="controls">
        <button id="previous" type="button">Previous</button>
        <button id="next" type="button">Next</button>
        <span id="position" aria-live="polite"></span>
      </div>
    </section>
    <section aria-label="Call stack and locals">
      <h2>Call stack</h2>
      <p id="event-info" aria-live="polite"></p>
      <div id="frames" role="region" aria-label="Call frames"></div>
    </section>
  </main>
  <script id="trace-data" type="application/json">__TRACE_RECORDING_JSON__</script>
  <script>
    const recordingData = JSON.parse(document.getElementById('trace-data').textContent);
    const sourceLines = recordingData.source.split(/\r\n|\n|\r/);
    const snapshots = recordingData.recording;
    const source = document.getElementById('source');
    const frames = document.getElementById('frames');
    const eventInfo = document.getElementById('event-info');
    const position = document.getElementById('position');
    const previousButton = document.getElementById('previous');
    const nextButton = document.getElementById('next');
    let index = 0;
    let highlightedLine = null;
    let highlightedCallerLines = new Set();

    function renderSource() {
      const fragment = document.createDocumentFragment();
      sourceLines.forEach((line, index) => {
        const row = document.createElement('div');
        row.className = 'source-line';
        row.id = `source-line-${index + 1}`;

        const lineNumber = document.createElement('span');
        lineNumber.className = 'line-number';
        lineNumber.textContent = String(index + 1);

        const text = document.createElement('code');
        text.className = 'source-text';
        text.textContent = line || ' ';

        row.append(lineNumber, text);
        fragment.appendChild(row);
      });
      source.replaceChildren(fragment);
    }

    function formatInline(value) {
      const { type, data } = value;
      if (type === 'NoneType') return 'None';
      if (type === 'bool') return data ? 'True' : 'False';
      if (type === 'str') return JSON.stringify(data);
      if (type === 'int' || type === 'float') return String(data);
      if (type === 'opaque') return `<opaque ${data.python_type}>`;
      if (type === 'list') return `[${data.map(formatInline).join(', ')}]`;
      if (type === 'tuple') return `(${data.map(formatInline).join(', ')}${data.length === 1 ? ',' : ''})`;
      if (type === 'dict') {
        return `{${data.map(([key, item]) => `${formatInline(key)}: ${formatInline(item)}`).join(', ')}}`;
      }
      return `${type}(${formatInline(data)})`;
    }

    function indentLines(text, prefix) {
      return `${prefix}${text.replace(/\n/g, `\n${prefix}`)}`;
    }

    function formatValue(value, depth = 0) {
      const { type, data } = value;
      if (type !== 'list' && type !== 'dict') {
        if (!['tuple', 'NoneType', 'bool', 'int', 'float', 'str', 'opaque'].includes(type)) {
          return `${type}(${formatValue(data, depth)})`;
        }
        return formatInline(value);
      }

      const inline = formatInline(value);
      if (inline.length <= 20) return inline;

      const indent = '  '.repeat(depth);
      const childIndent = '  '.repeat(depth + 1);
      if (type === 'list') {
        const items = data.map(item => indentLines(formatValue(item, depth + 1), childIndent));
        return `[\n${items.join(',\n')}\n${indent}]`;
      }
      const entries = data.map(([key, item]) =>
        `${childIndent}${formatInline(key)}: ${indentLines(formatValue(item, depth + 1), `${childIndent}  `)}`
      );
      return `{\n${entries.join(',\n')}\n${indent}}`;
    }

    function displayType(value) {
      return value.type === 'opaque' ? value.data.python_type : value.type;
    }

    function renderFrame(frame, isCurrent = false) {
      const card = document.createElement('article');
      card.className = 'frame-card';
      if (isCurrent) card.classList.add('current-frame');

      const heading = document.createElement('div');
      heading.className = 'frame-heading';
      heading.textContent = `${frame.qualified_function} · line ${frame.lineno}`;
      card.appendChild(heading);

      const entries = Object.entries(frame.locals || {});
      if (entries.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No local variables.';
        card.appendChild(empty);
      } else {
        for (const [name, value] of entries) {
          const variable = document.createElement('div');
          variable.className = 'variable-card';

          const label = document.createElement('strong');
          label.className = 'variable-name';
          label.textContent = name;

          const type = document.createElement('span');
          type.className = 'variable-type';
          type.textContent = `(${displayType(value)}):`;

          const renderedValue = document.createElement('pre');
          renderedValue.className = 'variable-value';
          renderedValue.textContent = formatValue(value);

          variable.append(label, type, renderedValue);
          card.appendChild(variable);
        }
      }

      const returned = frame.call_return || (
        frame.event === 'return' && frame.return
          ? { qualified_function: frame.qualified_function, value: frame.return.value }
          : null
      );
      if (returned) {
        const notice = document.createElement('div');
        notice.className = 'return-notice';
        notice.append('function ');

        const functionName = document.createElement('strong');
        functionName.textContent = returned.qualified_function;
        notice.append(functionName, ' returned ');

        const returnType = document.createElement('span');
        returnType.textContent = `(${displayType(returned.value)}):`;
        notice.append(returnType);

        const returnValue = document.createElement('code');
        returnValue.textContent = formatValue(returned.value);
        notice.append(returnValue);
        card.appendChild(notice);
      }
      return card;
    }

    function renderCallStack(snapshot) {
      frames.replaceChildren();
      const fragment = document.createDocumentFragment();
      for (const caller of snapshot.callers || []) {
        fragment.appendChild(renderFrame(caller));
      }
      fragment.appendChild(renderFrame(snapshot, true));
      frames.appendChild(fragment);
    }

    function renderSnapshot() {
      const snapshot = snapshots[index];
      if (!snapshot) {
        eventInfo.textContent = 'No snapshots were recorded.';
        frames.replaceChildren();
        position.textContent = '0 / 0';
        previousButton.disabled = true;
        nextButton.disabled = true;
        return;
      }

      if (highlightedLine !== null) {
        document.getElementById(`source-line-${highlightedLine}`)?.classList.remove('current');
      }
      for (const lineNumber of highlightedCallerLines) {
        document.getElementById(`source-line-${lineNumber}`)?.classList.remove('call-site');
      }

      highlightedCallerLines = new Set(
        (snapshot.callers || [])
          .map(caller => caller.lineno)
          .filter(Number.isInteger)
      );
      for (const lineNumber of highlightedCallerLines) {
        document.getElementById(`source-line-${lineNumber}`)?.classList.add('call-site');
      }

      highlightedLine = Number.isInteger(snapshot.lineno) ? snapshot.lineno : null;
      if (highlightedLine !== null) {
        const line = document.getElementById(`source-line-${highlightedLine}`);
        line?.classList.add('current');
        line?.scrollIntoView({ block: 'nearest' });
      }

      eventInfo.textContent = `${snapshot.event} · ${snapshot.qualified_function} · line ${snapshot.lineno}`;
      renderCallStack(snapshot);
      position.textContent = `${index + 1} / ${snapshots.length}`;
      previousButton.disabled = index === 0;
      nextButton.disabled = index === snapshots.length - 1;
    }

    previousButton.addEventListener('click', () => {
      if (index > 0) {
        index -= 1;
        renderSnapshot();
      }
    });
    nextButton.addEventListener('click', () => {
      if (index < snapshots.length - 1) {
        index += 1;
        renderSnapshot();
      }
    });
    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.key === 'ArrowLeft' && index > 0) {
        index -= 1;
        renderSnapshot();
      } else if (event.key === 'ArrowRight' && index < snapshots.length - 1) {
        index += 1;
        renderSnapshot();
      }
    });

    document.getElementById('title').textContent = recordingData.filename || 'Trace recording';
    renderSource();
    renderSnapshot();
  </script>
</body>
</html>
